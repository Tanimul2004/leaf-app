<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaf Disease & Species Classifier</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { background-color: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        .btn:hover { background-color: #218838; }
        img { max-width: 100%; height: auto; margin-top: 15px; border-radius: 8px; }
        .result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Leaf Image Classifier</h2>
        <form action="/predict" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required style="margin-bottom: 15px;"><br>
            <button type="submit" class="btn">Upload & Predict</button>
        </form>

        {% if prediction %}
            <div class="result">
                <h3>Prediction Result: {{ prediction }}</h3>
                <p>Confidence: {{ confidence }}%</p>
                <img src="{{ image_path }}" alt="Uploaded Leaf">
            </div>
        {% endif %}
    </div>
</body>
</html>
